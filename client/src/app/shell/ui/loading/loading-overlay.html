@if (isLoading()) {
  <div
    class="fixed inset-0 z-[9999] flex items-center justify-center bg-opacity-90 bg-black transition-all duration-300"
  >
    <nz-spin
      nzSimple
      [nzSize]="'large'"
      [nzSpinning]="isLoading()"
      [nzTip]="tip()"
    >
      <div class="loading-content"></div>
    </nz-spin>
  </div>
}
